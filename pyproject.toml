[build-system]
requires = ["setuptools>=61"]
build-backend = "setuptools.build_meta"

[project]
name = "ddo-pulse"
version = "0.1.0"
description = "Lightweight blog aggregation with LLM curation"
readme = "docs/mvp.md"
requires-python = ">=3.11"
dependencies = [
    "typer>=0.9.0",
    "httpx>=0.27.0",
    "feedparser>=6.0.0",
    "pydantic>=2.0.0",
    "pyyaml>=6.0.0",
]

[project.scripts]
ddo-pulse = "ddo_pulse_cli.main:app"

[tool.setuptools.packages.find]
where = [
    "services/backend/cli",
    "services/backend/core",
    "services/backend/db",
]
include = ["ddo_pulse_*"]
